name: Deploy bot to XS Systems panel

# Pterodactyl-style panels (XS Systems included) have no GitHub integration:
# no webhook, no git in the File Manager, and the console is the bot's stdin —
# typing "git pull" there does nothing. So the push happens from GitHub
# instead: these files go over the SFTP details the panel already shows, then
# the panel API restarts the server.
#
# Nothing runs until the secrets exist — without them this workflow is a green
# no-op, so forks and pull requests are unaffected.
#
#   Repo → Settings → Secrets and variables → Actions
#   secrets:  PANEL_SFTP_HOST  PANEL_SFTP_PORT  PANEL_SFTP_USER  PANEL_SFTP_PASS
#             PANEL_API_KEY   (optional, panel → Account → API Credentials)
#   vars:     PANEL_URL  PANEL_SERVER_ID  (optional — enables the auto-restart)
#
# Host/port/user/number come straight from the panel's "SFTP Details" box; the
# password is the one you log into the panel with — it is only ever used here,
# inside the runner, and never written to a file or the log.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dashboard/**'      # the web portal deploys to Vercel, not to the panel
      - '**.md'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'First upload: also send .git so the server can "git pull" later'
        type: boolean
        default: false

concurrency:
  group: panel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload to panel over SFTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Are the panel secrets configured?
        id: cfg
        env:
          H: ${{ secrets.PANEL_SFTP_HOST }}
          U: ${{ secrets.PANEL_SFTP_USER }}
          P: ${{ secrets.PANEL_SFTP_PASS }}
        run: |
          if [ -n "$H" ] && [ -n "$U" ] && [ -n "$P" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PANEL_SFTP_HOST / PANEL_SFTP_USER / PANEL_SFTP_PASS are not all set — skipping the panel deploy."
          fi

      - name: Install lftp
        if: steps.cfg.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # mirror -R = upload, and deliberately NO --delete: a deploy can add or
      # overwrite files but never removes anything from the server, so session/,
      # .env and database/*.json live on untouched.
      - name: Upload the bot
        if: steps.cfg.outputs.ready == 'true'
        env:
          SFTP_HOST: ${{ secrets.PANEL_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.PANEL_SFTP_PORT || '2022' }}
          SFTP_USER: ${{ secrets.PANEL_SFTP_USER }}
          SFTP_PASS: ${{ secrets.PANEL_SFTP_PASS }}
          INCLUDE_GIT: ${{ inputs.bootstrap == true && '1' || '0' }}
        run: |
          set -euo pipefail
          # a password containing " or \ would break the lftp command string
          SAFE_PASS=${SFTP_PASS//\\/\\\\}
          SAFE_PASS=${SAFE_PASS//\"/\\\"}
          EXCLUDES=(
            --exclude-glob .github/
            --exclude-glob node_modules/
            --exclude-glob dashboard/
            --exclude-glob session/
            --exclude-glob temp/
            --exclude-glob data/
            --exclude-glob .env
            --exclude-glob 'database/*.json'
            --exclude-glob '*.log'
          )
          if [ "$INCLUDE_GIT" != "1" ]; then
            EXCLUDES+=(--exclude-glob .git/)
          fi

          lftp -c "
            set sftp:auto-confirm yes;
            set net:timeout 25;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            open -u \"$SFTP_USER\",\"$SAFE_PASS\" sftp://$SFTP_HOST:${SFTP_PORT:-2022};
            mirror -R --verbose --no-perms --parallel=4 ${EXCLUDES[*]} ./ /;
            bye
          "

      - name: Restart the server so the new code runs
        if: steps.cfg.outputs.ready == 'true'
        # `run:` steps execute with `bash -e`, so ONE failed command aborts the
        # step with curl's own exit code — that turned run 39775470548 red after
        # a perfectly good upload. Nothing here may fail the job, a wrong URL
        # must not stop the restart, and the diagnostics go into the annotation
        # so they are visible without opening the log.
        shell: bash
        env:
          PANEL_URL: ${{ vars.PANEL_URL || secrets.PANEL_URL }}
          PANEL_SERVER_ID: ${{ vars.PANEL_SERVER_ID || secrets.PANEL_SERVER_ID }}
          PANEL_API_KEY: ${{ secrets.PANEL_API_KEY }}
          SFTP_HOST: ${{ secrets.PANEL_SFTP_HOST }}
        run: |
          set +e
          if [ -z "$PANEL_SERVER_ID" ] || [ -z "$PANEL_API_KEY" ]; then
            echo "::notice::Restart skipped: PANEL_SERVER_ID / PANEL_API_KEY not set. Files were uploaded — press Restart in the panel."
            exit 0
          fi

          # candidates: the configured URL, then the panel next to the SFTP node
          # (eu3-node.xsystemshosting.com → panel.xsystemshosting.com), https and http
          CANDS=()
          [ -n "$PANEL_URL" ] && CANDS+=("$PANEL_URL")
          if [ -n "$SFTP_HOST" ]; then
            BASE_HOST="panel.${SFTP_HOST#*.}"
            CANDS+=("https://$BASE_HOST" "http://$BASE_HOST")
          fi
          [ ${#CANDS[@]} -eq 0 ] && CANDS=("https://panel.xsystemshosting.com")

          ok=""; LAST="none"
          for raw in "${CANDS[@]}"; do
            BASE=${raw%/}
            BASE=${BASE%%/server/*}
            [ -z "$BASE" ] && continue
            echo "→ $BASE"
            code=$(curl -sS --max-time 20 -o /tmp/out -w '%{http_code}' -X POST \
              "$BASE/api/client/servers/$PANEL_SERVER_ID/power" \
              -H "Authorization: Bearer $PANEL_API_KEY" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              -d '{"signal":"restart"}' 2>/tmp/err) || code="curl:$?"
            body=$(head -c 200 /tmp/out 2>/dev/null | tr -d '\n')
            err=$(head -c 160 /tmp/err 2>/dev/null | tr -d '\n')
            echo "   $code $body $err"
            LAST="$code @ $BASE"
            case "$code" in
              200|204) ok="$BASE"; break ;;
              000|curl:6|curl:7|curl:28|curl:35) continue ;;   # unreachable — try the next host
              *) break ;;                                      # reachable, refused: report it
            esac
          done

          if [ -n "$ok" ]; then
            echo "::notice::✅ Restart requested via $ok"
            exit 0
          fi
          echo "::warning::Restart not accepted ($LAST). The files ARE uploaded — press Restart in the panel. (401/403 = PANEL_API_KEY is not a client key or was revoked; curl:6/35 = that host is unreachable from the runner.)"
          exit 0
